[project]
name = "assetgraph-kokoro-tts"
version = "0.1.0"
description = "Pinned local Kokoro HTTP service for AssetGraph video production"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "huggingface-hub==0.34.4",
    "kokoro==0.9.4",
    "misaki[zh]==0.9.4",
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
assetgraph-kokoro-tts = "assetgraph_tts.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assetgraph_tts"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
