[project]
name = "assetgraph-browser-use-worker"
version = "0.1.0"
description = "Browser-use worker for AssetGraph Maitu automation tasks"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_use_worker"]
