services:
  streamcap:
    image: assetgraph/streamcap:v1.0.3-ba9f1e6
    build:
      context: https://github.com/ihmily/StreamCap.git#ba9f1e6e6a861ad489e738cf5f5bee491774e972
    restart: unless-stopped
    init: true
    user: "${LIVE_RESEARCH_UID:-1000}:${LIVE_RESEARCH_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      PLATFORM: web
      TZ: UTC
      HOST: 0.0.0.0
      PORT: "6006"
      AUTO_CHECK_UPDATE: "false"
    ports:
      - "127.0.0.1:${STREAMCAP_PORT:-6006}:6006"
    volumes:
      - ./config/streamcap/default_settings.json:/app/config/default_settings.json:ro
      - ./config/streamcap/default_settings.json:/app/config/user_settings.json:ro
      - ${STREAMCAP_RECORDINGS_CONFIG:-./runtime/streamcap/recordings.json}:/app/config/recordings.json:rw
      - ${ASSETGRAPH_LIVE_RESEARCH_ROOT:-/DATA/Downloads/AssetGraph/live-research}/staging:/app/downloads/staging:rw
      - ${ASSETGRAPH_LIVE_RESEARCH_ROOT:-/DATA/Downloads/AssetGraph/live-research}/logs/streamcap:/app/logs:rw
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:6006/about >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [live-research]

  douyinlive:
    image: ghcr.io/jwwsjlm/douyinlive:v2.0.24@sha256:db05c36753c66ecd81852057a28f9e28b2bb30800e2ace36748c23cb38608c2a
    restart: unless-stopped
    init: true
    user: "${LIVE_RESEARCH_UID:-1000}:${LIVE_RESEARCH_GID:-1000}"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["--config", "/run/secrets/douyinlive-config.yaml"]
    ports:
      - "127.0.0.1:${DOUYINLIVE_PORT:-1088}:1088"
    volumes:
      - ${DOUYINLIVE_CONFIG_FILE:-./runtime/douyinlive-config.yaml}:/run/secrets/douyinlive-config.yaml:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "/app/douyinLive", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks: [live-research]

networks:
  live-research:
    internal: false
